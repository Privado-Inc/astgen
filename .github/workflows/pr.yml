name: pr

on:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: '0'
      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - name: Install ldid
        uses: MOZGIII/install-ldid-action@v1
        with:
          tag: v2.1.5-procursus6
      - name: Build
        run: |
          bun install --frozen-lockfile
          bun run typecheck
      - name: Test
        run: |
          bun run test
      - name: Create Binaries
        run: |
          bun run binary
      - name: Sign macOS binaries (ad-hoc)
        run: |
          ldid -S astgen-macos-x64
          ldid -S astgen-macos-arm64
      - name: Rename
        run: |
          mv astgen-linux-x64 astgen-linux
          mv astgen-linux-arm64 astgen-linux-arm
          mv astgen-macos-x64 astgen-macos
          mv astgen-macos-arm64 astgen-macos-arm
          mv astgen-win-x64.exe astgen-win.exe
      - name: Run gzexe
        run: |
          gzexe astgen-linux
          gzexe astgen-linux-arm
      - name: Make executable
        run: |
          chmod +x astgen-macos
          chmod +x astgen-macos-arm
          chmod +x astgen-linux
          chmod +x astgen-linux-arm
      - name: Print stats
        run: |
          ls -lh
      - name: Print version
        run: |
          ./astgen-linux --version
